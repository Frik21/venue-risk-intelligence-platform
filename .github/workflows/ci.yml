name: CI

# Closes the Outstanding item "CI running pnpm run build/typecheck
# automatically on every PR - none configured yet, all verification
# this session was manual" (CLAUDE.md's Operational safety net
# section). Every workspace's own typecheck + build, same `pnpm run
# build` command the repo's own Workflow section already requires
# before every commit - this just makes sure it actually ran, on every
# PR, not only when someone remembered to run it locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Matches the frontend build's own requirement (see vite.config.ts) -
    # no real values needed, this job never serves traffic or talks to a
    # database, it only typechecks and bundles.
    env:
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  test:
    # Platform Maturity Roadmap, Tier 3, item 8 - extends CI to run the
    # real-Postgres test suite added for item 7, not just typecheck+
    # build. Separate job (not folded into `build` above) since this
    # one needs a database service the build job deliberately doesn't -
    # keeps that job's own "never talks to a database" comment true.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venueguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/venueguard_test
      SESSION_SECRET: ci-test-session-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @workspace/db run push

      - run: pnpm --filter @workspace/api-server run test
